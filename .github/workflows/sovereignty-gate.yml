# Sovereignty Gate - IONOS-Only Data Residency Check
#
# This workflow scans source files for references to banned cloud providers
# that would violate IONOS_ONLY data sovereignty requirements.
#
# EXCEPTION: functions/src/emailIntelligence/** is allowed to reference
# Google/Microsoft endpoints for upstream mailbox connectivity.
#
# Modes:
#   - WARN (current): Logs violations but passes - non-blocking
#   - ERROR (future): Fails on NEW violations vs baseline
#
# Baseline:
#   - Only NEW violations (not in baseline.json) are flagged
#   - Run `npm run sovereignty:baseline` to update baseline
#
# TODO: Flip to ERROR mode when Phase 3/4 migration is complete
#
# @see /docs/sovereignty/definition.md
# @see /scripts/sovereignty/README.md

name: Sovereignty Gate

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  sovereignty-scan:
    name: Scan for Banned Providers
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      
      # Note: We don't need to install dependencies for the scanner
      # It only uses Node.js built-in modules (fs, path)
      
      - name: Run Sovereignty Scanner (JS)
        id: scan-js
        env:
          # TODO: Flip to 'error' when Phase 3/4 complete (PostgreSQL + AI Gateway migration)
          # Currently in WARN mode - violations are logged but don't fail the build
          SOVEREIGNTY_SCAN_MODE: warn
          SOVEREIGNTY_SCAN_BASELINE: on
        run: |
          echo "::group::Sovereignty Scan Output (JS)"
          node scripts/sovereignty/check-banned-strings.js
          echo "::endgroup::"
      
      - name: Run Banned Strings CI Gate (Bash)
        id: scan-bash
        env:
          SOVEREIGNTY_SCAN_MODE: warn
        run: |
          echo "::group::Banned Strings CI Gate"
          chmod +x scripts/ci/check-banned-strings.sh
          ./scripts/ci/check-banned-strings.sh
          echo "::endgroup::"
      
      - name: Run No-Google-Ever Check
        id: no-google
        run: |
          echo "::group::No-Google-Ever Check"
          chmod +x scripts/no-google-ever.sh
          ./scripts/no-google-ever.sh
          echo "::endgroup::"

  release-gate:
    name: Release Gate
    runs-on: ubuntu-latest
    needs: [sovereignty-scan]
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build
        run: npm run build
      
      - name: Run Release Gate
        env:
          # For CI, we use a placeholder token - storage smoke test will be skipped
          # Real token can be added as secret for full integration testing
          TRADETRACKR_TEST_TOKEN: ${{ secrets.TRADETRACKR_TEST_TOKEN }}
        run: |
          chmod +x scripts/release-gate.sh
          ./scripts/release-gate.sh || echo "::warning::Release gate had skipped checks (missing token)"

  secrets-scan:
    name: Check No Secrets in Build
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build
        run: npm run build
      
      - name: Check for secrets in dist/
        run: |
          chmod +x scripts/check-no-secrets-in-dist.sh
          ./scripts/check-no-secrets-in-dist.sh
      
      - name: Summary
        if: always()
        run: |
          echo "## 🔐 Secrets Scan Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Scanned dist/ for:" >> $GITHUB_STEP_SUMMARY
          echo "- VITE_AI_GATEWAY_TOKEN" >> $GITHUB_STEP_SUMMARY
          echo "- AI_GATEWAY_TOKEN" >> $GITHUB_STEP_SUMMARY
          echo "- Hardcoded Bearer tokens" >> $GITHUB_STEP_SUMMARY
          echo "- JWT tokens" >> $GITHUB_STEP_SUMMARY

  summary:
    name: Gate Summary
    needs: [sovereignty-scan, secrets-scan]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Summary
        run: |
          echo "## 🛡️ Sovereignty Gate Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| **Banned Providers** | ${{ needs.sovereignty-scan.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Secrets in Build** | ${{ needs.secrets-scan.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Setting | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| **Mode** | \`warn\` (non-blocking) |" >> $GITHUB_STEP_SUMMARY
          echo "| **Baseline** | \`on\` (only NEW violations flagged) |" >> $GITHUB_STEP_SUMMARY
          echo "| **Exception Path** | \`functions/src/emailIntelligence/**\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### To Enable Blocking Mode" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "When Phase 3/4 migration is complete, update this workflow:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`yaml" >> $GITHUB_STEP_SUMMARY
          echo "SOVEREIGNTY_SCAN_MODE: error  # Was: warn" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Documentation" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- [Sovereignty Definition](/docs/sovereignty/definition.md)" >> $GITHUB_STEP_SUMMARY
          echo "- [Scanner README](/scripts/sovereignty/README.md)" >> $GITHUB_STEP_SUMMARY
