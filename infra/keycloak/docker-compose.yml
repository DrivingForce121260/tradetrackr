# TradeTrackr Keycloak - Self-Hosted Identity Provider
# 
# Deploys Keycloak with PostgreSQL backend for production use.
# For IONOS VPS deployment (Germany data residency).
#
# Usage:
#   docker-compose up -d
#
# See: runbooks/keycloak-setup.md

version: '3.9'

services:
  keycloak-db:
    image: postgres:15-alpine
    container_name: tradetrackr-keycloak-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${KC_DB_DATABASE:-keycloak}
      POSTGRES_USER: ${KC_DB_USER:-keycloak}
      POSTGRES_PASSWORD: ${KC_DB_PASSWORD:?KC_DB_PASSWORD required}
    volumes:
      - keycloak-db-data:/var/lib/postgresql/data
    networks:
      - keycloak-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${KC_DB_USER:-keycloak}"]
      interval: 10s
      timeout: 5s
      retries: 5

  keycloak:
    image: quay.io/keycloak/keycloak:23.0
    container_name: tradetrackr-keycloak
    restart: unless-stopped
    depends_on:
      keycloak-db:
        condition: service_healthy
    command:
      - start
      - --import-realm
    environment:
      # Database
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/${KC_DB_DATABASE:-keycloak}
      KC_DB_USERNAME: ${KC_DB_USER:-keycloak}
      KC_DB_PASSWORD: ${KC_DB_PASSWORD:?KC_DB_PASSWORD required}
      
      # Admin user (first run only)
      KEYCLOAK_ADMIN: ${KC_ADMIN_USER:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD:?KC_ADMIN_PASSWORD required}
      
      # Hostname (for OIDC issuer)
      KC_HOSTNAME: ${KC_HOSTNAME:-auth.tradetrackr.de}
      KC_HOSTNAME_STRICT: 'true'
      KC_HOSTNAME_STRICT_HTTPS: 'true'
      
      # Proxy settings (behind nginx/reverse proxy)
      KC_PROXY: edge
      KC_HTTP_ENABLED: 'true'
      KC_HTTP_PORT: 8080
      
      # Health checks
      KC_HEALTH_ENABLED: 'true'
      KC_METRICS_ENABLED: 'true'
      
      # Logging
      KC_LOG_LEVEL: ${KC_LOG_LEVEL:-info}
    volumes:
      - ./realm-tradetrackr.json:/opt/keycloak/data/import/realm-tradetrackr.json:ro
    ports:
      - "127.0.0.1:8080:8080"
    networks:
      - keycloak-internal
      - web
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health/ready || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  keycloak-db-data:
    driver: local

networks:
  keycloak-internal:
    driver: bridge
  web:
    external: true
    name: ${DOCKER_NETWORK:-web}

