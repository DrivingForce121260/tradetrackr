# auth.tradetrackr.de - Keycloak Identity Provider
# Reverse proxy to Keycloak running on localhost:8080

# HTTP -> HTTPS redirect + ACME
server {
    listen 85.214.6.74:80;
    listen [::]:80;
    server_name auth.tradetrackr.de;

    # ACME challenge for Let's Encrypt
    location ^~ /.well-known/acme-challenge/ {
        auth_basic off;
        allow all;
        root /var/www/letsencrypt;
        try_files $uri =404;
    }

    # Redirect everything else to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS - Keycloak proxy
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name auth.tradetrackr.de;

    # SSL certificates (managed by certbot)
    ssl_certificate /etc/letsencrypt/live/auth.tradetrackr.de/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/auth.tradetrackr.de/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Security headers
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Proxy settings for Keycloak
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        
        # Required headers for Keycloak behind reverse proxy
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port 443;
        
        # WebSocket support (for admin console)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # Timeouts
        proxy_connect_timeout 30s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        
        # Buffer settings
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
        
        # Large body for user imports
        client_max_body_size 10m;
    }
}

